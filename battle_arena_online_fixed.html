<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battle Arena Online</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070914;color:#fff;font-family:Arial,sans-serif}
button,input{font:inherit}.screen{height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(720px,94vw);padding:30px;border:1px solid #ffffff20;border-radius:28px;background:#ffffff0b;box-shadow:0 25px 80px #0009;text-align:center}.logo{font-size:clamp(42px,9vw,78px);font-weight:950;background:linear-gradient(90deg,#fff,#42eaff,#9d65ff);-webkit-background-clip:text;color:transparent}.sub{color:#aab2d0;margin:8px 0 25px}.btn{border:0;border-radius:14px;padding:14px 22px;margin:5px;color:#fff;background:linear-gradient(135deg,#7147ff,#00a8ff);font-weight:900;cursor:pointer}.btn.red{background:linear-gradient(135deg,#ff315d,#ff7b18)}input{width:100%;padding:14px;border-radius:12px;border:1px solid #fff2;background:#ffffff0d;color:#fff;margin:7px 0;outline:0}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.small{font-size:14px;color:#aab2d0;line-height:1.5}
#game{position:relative;width:100vw;height:100vh;background:#080b18}.hidden{display:none!important}#world{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:7px;z-index:5;pointer-events:none}.hud{background:#0009;border:1px solid #fff2;border-radius:12px;padding:8px 11px}.hpbar{width:130px;height:9px;background:#333;border-radius:9px;overflow:hidden}.hp{height:100%;background:#36e37b}
#joy{position:absolute;bottom:25px;left:25px;width:135px;height:135px;border:2px solid #fff2;border-radius:50%;background:#ffffff12;z-index:7;touch-action:none}.stick{position:absolute;left:38px;top:38px;width:58px;height:58px;border-radius:50%;background:#ffffff35}
#fire{position:absolute;right:25px;bottom:30px;width:105px;height:105px;border:0;border-radius:50%;background:radial-gradient(circle,#ff9aaa,#ff164d 60%,#7b0e2b);color:#fff;font-weight:900;z-index:7;touch-action:none}
#msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px;font-weight:900;text-align:center;pointer-events:none;text-shadow:0 4px 20px #000;z-index:6}.room{font-size:28px;letter-spacing:4px;font-weight:900}.status{color:#9fefff}
.modal{position:absolute;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:20}.modal .card h2{font-size:42px}
@media(min-width:800px){#joy{display:none}}
</style>
</head>
<body>

<div id="home" class="screen"><div class="card">
<div class="logo">⚔️ BATTLE ARENA</div><div class="sub">REAL PLAYERS • ONLINE ROOMS • 2–8 PLAYERS</div>
<input id="name" maxlength="15" placeholder="Your player name">
<div class="row"><button class="btn" onclick="createRoom()">CREATE ROOM</button><button class="btn red" onclick="joinRoom()">JOIN ROOM</button></div>
<div id="roomInfo" class="small" style="margin-top:18px"></div>
<p class="small">This browser client uses WebSocket networking. Set the server URL below to your deployed multiplayer server.</p>
<input id="server" type="hidden" value="wss://battle-arena-server-t0lm.onrender.com">
</div></div>

<div id="game" class="hidden">
<canvas id="world"></canvas>
<div id="hud"><div class="hud">❤️ <b id="hpText">100</b><div class="hpbar"><div id="hp" class="hp"></div></div></div><div class="hud">🎯 <b id="kills">0</b></div><div class="hud">👥 <b id="players">1</b></div><div class="hud">🔑 <b id="roomCode">----</b></div></div>
<div id="msg"></div><div id="joy"><div class="stick"></div></div><button id="fire">🔫<br>FIRE</button>
</div>

<div id="end" class="modal hidden"><div class="card"><h2>🏆 GAME OVER</h2><p id="result"></p><button class="btn" onclick="location.reload()">PLAY AGAIN</button></div></div>

<script>
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');let W,H,ws=null,connected=false,room='',me={id:'',x:0,y:0,hp:100,angle:0,name:''},players={},bullets=[],joy={x:0,y:0},shooting=false,sound=true,audio=null,last=0;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}addEventListener('resize',resize);resize();
function beep(f=500,d=.07){if(!sound)return;if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d+.02)}
function url(){return 'wss://battle-arena-server-t0lm.onrender.com'}
function playerName(){return document.getElementById('name').value.trim()||'Player'}
function createRoom(){room=Math.random().toString(36).slice(2,7).toUpperCase();connect('create')}
function joinRoom(){let r=prompt('Enter room code');if(!r)return;room=r.trim().toUpperCase();connect('join')}
function connect(type){
let u=url();if(!u){alert('Online server unavailable.');return}
try{ws=new WebSocket(u)}catch(e){alert('Invalid WebSocket URL');return}
document.getElementById('roomInfo').textContent='Connecting...';
ws.onopen=()=>{connected=true;ws.send(JSON.stringify({type,room,name:playerName()}));document.getElementById('roomInfo').innerHTML='Room: <b class="room">'+room+'</b> — waiting for players…';beep(700,.15)}
ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='welcome'){me.id=m.id;me.name=playerName();me.x=m.x;me.y=m.y;document.getElementById('roomCode').textContent=room;document.getElementById('home').classList.add('hidden');document.getElementById('game').classList.remove('hidden');document.getElementById('msg').textContent='Waiting for players…';requestAnimationFrame(loop)}if(m.type==='state'){players=m.players||{};bullets=m.bullets||[];if(players[me.id])me={...me,...players[me.id]};document.getElementById('players').textContent=Object.keys(players).length;document.getElementById('hpText').textContent=Math.max(0,Math.floor(me.hp));document.getElementById('hp').style.width=Math.max(0,me.hp)+'%';if(Object.keys(players).length>1)document.getElementById('msg').textContent=''}if(m.type==='event'){if(m.event==='shoot')beep(170,.05);if(m.event==='hit')beep(500,.06);if(m.event==='win'){beep(1000,.3);document.getElementById('end').classList.remove('hidden');document.getElementById('result').textContent=m.name+' wins!'}}};
ws.onclose=()=>{connected=false;document.getElementById('msg').textContent='Disconnected';}
}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
addEventListener('keydown',e=>{if(['w','a','s','d',' '].includes(e.key.toLowerCase()))e.preventDefault()});
let keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function moveJoy(e){let r=document.getElementById('joy').getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy)||1,max=48;if(m>max){dx=dx/m*max;dy=dy/m*max}joy.x=dx/max;joy.y=dy/max;document.querySelector('.stick').style.transform=`translate(${dx}px,${dy}px)`}
let j=document.getElementById('joy');j.addEventListener('pointerdown',moveJoy);j.addEventListener('pointermove',moveJoy);j.addEventListener('pointerup',()=>{joy.x=joy.y=0;document.querySelector('.stick').style.transform='translate(0,0)'});
document.getElementById('fire').addEventListener('pointerdown',e=>{e.preventDefault();shooting=true;shoot()});addEventListener('pointerup',()=>shooting=false);
function shoot(){if(!connected)return;send({type:'shoot',angle:me.angle});beep(170,.05)}
function loop(t){let dt=Math.min(.04,(t-last)/1000||.016);last=t;let mx=(keys.d?1:0)-(keys.a?1:0)+joy.x,my=(keys.s?1:0)-(keys.w?1:0)+joy.y;if(mx||my){let m=Math.hypot(mx,my);mx/=m;my/=m;me.angle=Math.atan2(my,mx);send({type:'move',x:mx,y:my,angle:me.angle})}else if(connected)send({type:'move',x:0,y:0,angle:me.angle});if(shooting)shoot();draw();requestAnimationFrame(loop)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#090c18';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#141b34';for(let x=0;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let id in players){let p=players[id];ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle||0);ctx.fillStyle=id===me.id?'#3edcff':'#ff3d65';ctx.shadowBlur=18;ctx.shadowColor=ctx.fillStyle;ctx.fillRect(-18,-18,36,36);ctx.fillStyle='#fff';ctx.fillRect(5,-4,25,8);ctx.restore();ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.textAlign='center';ctx.fillText(p.name||'Player',p.x,p.y-25)}for(let b of bullets){ctx.fillStyle='#ffe66b';ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill()}}
</script>
</body></html>
